interface:
  display_name: "Nipmod Package Decision"
  short_description: "Pre-install package decisions for Codex"
  icon_small: "assets/nipmod-logo.png"
  icon_large: "assets/nipmod-logo.png"
  brand_color: "#E5392B"
  default_prompt: "Use Nipmod to choose the best package for this repo, show trust/risk and the install boundary, then wait for approval before changing dependencies."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "nipmod"
      description: "Nipmod package decision MCP server"
      transport: "streamable_http"
      url: "https://nipmod.com/api/mcp"
