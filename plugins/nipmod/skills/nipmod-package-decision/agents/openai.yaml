interface:
  display_name: "Nipmod Package Decision"
  short_description: "Codex package preflight and install guard"
  icon_small: "assets/nipmod-logo.png"
  icon_large: "assets/nipmod-logo.png"
  brand_color: "#E5392B"
  default_prompt: "Use Nipmod before package choices and install writes. Show trust/risk, approval packet and boundary, then wait for approval."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "nipmod"
      description: "Nipmod package decision MCP server"
      transport: "streamable_http"
      url: "https://nipmod.com/api/mcp"
