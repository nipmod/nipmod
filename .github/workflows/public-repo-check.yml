name: Public repo check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.0 --activate
      - name: Verify public boundary
        run: |
          test ! -e site
          test ! -e supabase
          test ! -e tools
          test ! -e packages
          test ! -e cli/node_modules
          test ! -e cli/dist
          test ! -e .cursor
          test ! -e .mcp.json
          test ! -e opencode.json
          ! find . -path ./.git -prune -o -name '*.sql' -print | grep .
          grep -q "The hosted product, backend implementation" README.md
          grep -q "public CLI source" README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f SUPPORT.md
          test -f docs/independent-review.md
      - name: Verify public CLI
        run: |
          pnpm --dir cli install --frozen-lockfile
          pnpm --dir cli typecheck
          pnpm --dir cli test
          pnpm --dir cli build
